<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <!-- CSS -->
  <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>/* Tiny Hand With Pink Heart - https://www.cursors-4u.com/cursor/tiny-hand-with-pink-heart */
* {
  cursor: url('https://cdn.cursors-4u.net/previews/tiny-hand-with-pink-heart-30ad5441-32.webp') 34 32, auto !important;
}
/* End www.Cursors-4U.com Code */</style>
    <title>My Projects</title></head>

<body class="portfolio">

    <nav class="navbar">
        <div class="nav-links">
            <a href="index.html">HOME</a> 
            <a href="">ABOUT</a> 
            <a href="contact.html">CONTACT</a>
        </div>
    </nav>


<main class="projects-page">
    <header class="casting-header">
        <p>WELCOME TO</p>
        <h1>JASMINE'S GLAM BOARD</h1>
        <p>TEXTILE DESIGN • SOURCING • DEVELOPMENT</p>
        <span>SELECT A LOOK TO EXPLORE</span>
    </header>

    <section class="casting-grid">

        <!-- LOOK 001 -->
        <button class="project-card" data-project="look-001">
            <span class="model-number">LOOK 001</span>
            <div class="polaroid">
                <img src="Images/atelier/look-001.png"
                     alt="Feather motif corset">
            </div>
        </button>

        <!-- LOOK 002 -->
        <button class="project-card" data-project="look-002">
            <span class="model-number">LOOK 002</span>
            <div class="polaroid">
                <img src="Images/atelier/look-002.png"
                     alt="Floral print dress">
            </div>
        </button>

        <!-- LOOK 003 -->
        <button class="project-card" data-project="look-003">
            <span class="model-number">LOOK 003</span>
            <div class="polaroid">
                <img src="Images/atelier/look-003.png"
                     alt="Model wearing garment featuring my textile work">
            </div>
        </button>

    </section>
</main>

<!-- PROJECT DETAIL MODAL -->
<div class="project-modal" id="projectModal"
     aria-hidden="true">

    <div class="modal-content"
         role="dialog"
         aria-modal="true"
         aria-labelledby="modalTitle">

        <button class="modal-close"
                id="modalClose"
                aria-label="Close project details">
            &times;
        </button>

        <p class="modal-eyebrow" id="modalNumber">
            MODEL 001
        </p>

        <h2 id="modalTitle">Project Title</h2>

        <div class="modal-section">
            <h3>FABRIC & TRIMS</h3>
            <p id="modalMaterials"></p>
        </div>

        <div class="modal-section">
            <h3>MY ROLE</h3>
            <p id="modalRole"></p>
        </div>

        <div class="modal-section">
            <h3>BEHIND THE LOOK</h3>
            <div class="modal-gallery" id="modalGallery"></div>
        </div>

    </div>
</div>

<script src="projects.js"></script>
</body>
</html>
